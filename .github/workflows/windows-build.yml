name: Windows build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore WindowsLogger.sln
      - run: dotnet test tests/WindowsLogger.Core.Tests/WindowsLogger.Core.Tests.csproj --configuration Release --no-restore
      - run: dotnet build WindowsLogger.sln --configuration Release --no-restore
